[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-pipeline"
version = "0.1.0"
description = "Reusable offline evaluation pipeline for RAG retrieval quality (Recall@k, MRR, Hit Rate)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
